# ============================================================
#  Configuracion comun a todos los perfiles
# ============================================================
spring.application.name=smd-stock
server.port=${PORT:8080}

# Si no se indica perfil, se usa "dev" (H2 en memoria).
spring.profiles.default=dev

# Evita mantener la sesion de Hibernate abierta durante el render de la vista.
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Log de la aplicacion
logging.level.com.smd.inventario=INFO
