# ============================================================
#  Perfil devfile: H2 en archivo
#  Los datos sobreviven al reinicio de la aplicacion y quedan
#  guardados en ./data/smd.mv.db (relativo a la raiz del proyecto).
# ============================================================
spring.datasource.url=jdbc:h2:file:./data/smd;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea/actualiza el esquema a partir de las entidades.
spring.jpa.hibernate.ddl-auto=update

# Los datos de ejemplo los carga DevFileDataSeeder solo si la base esta vacia.
# Por eso data.sql no se ejecuta en este perfil.
spring.sql.init.mode=never

# Consola web de H2 en http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.database.nombre=H2 (archivo)
