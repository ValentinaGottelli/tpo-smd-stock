# ============================================================
#  Perfil dev: H2 en memoria (no requiere instalar nada)
# ============================================================
spring.datasource.url=jdbc:h2:mem:smd;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea/actualiza el esquema a partir de las entidades.
spring.jpa.hibernate.ddl-auto=update

# Ejecuta data.sql despues de que Hibernate cree las tablas.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Consola web de H2 en http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.database.nombre=H2 (memoria)
