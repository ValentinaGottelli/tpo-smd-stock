# ============================================================
#  Perfil mysql: base de datos relacional real
#
#  Variables de entorno opcionales:
#    DB_URL      (por defecto jdbc:mysql://localhost:3306/smd_stock)
#    DB_USER     (por defecto smd)
#    DB_PASSWORD (por defecto smd)
# ============================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smd_stock?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:smd}
spring.datasource.password=${DB_PASSWORD:smd}

# El esquema se versiona en src/main/resources/db/01-schema.sql.
# Hibernate solo valida que las entidades coincidan con las tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.sql.init.mode=never

app.database.nombre=MySQL
