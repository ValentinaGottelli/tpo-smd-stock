<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMD Stock</title>
<style>
  :root { --bg:#f6f6f4; --panel:#fff; --fg:#222; --mut:#6b6b6b; --line:#d9d9d4; --acc:#2f4858; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui,"Segoe UI",sans-serif; }
  header { display:flex; justify-content:space-between; align-items:baseline; padding:14px 24px; background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:16px; font-weight:600; }
  header small, header a { color:var(--mut); font-size:12px; margin-left:12px; }
  main { display:grid; grid-template-columns:300px 1fr; gap:24px; padding:24px; align-items:start; }
  main > div { min-width:0; }
  @media (max-width:900px) { main { grid-template-columns:1fr; } }
  section { background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:14px 16px; margin-bottom:16px; }
  h2 { margin:0 0 10px; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--mut); }
  h3 { margin:14px 0 6px; font-size:12px; font-weight:600; color:var(--mut); font-family:ui-monospace,Consolas,monospace; }
  label { display:block; margin:8px 0 2px; font-size:12px; color:var(--mut); }
  input[type=text], input[type=date], input[type=number], select { width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:3px; font:inherit; background:#fff; }
  .check { display:flex; align-items:center; gap:6px; margin-top:10px; color:var(--fg); font-size:13px; }
  .grupo { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:12px; }
  button { padding:7px 8px; border:1px solid var(--acc); background:#fff; color:var(--acc); border-radius:3px; font:inherit; cursor:pointer; }
  button:hover { background:var(--acc); color:#fff; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; font-weight:500; color:var(--mut); padding:4px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:4px 8px; border-bottom:1px solid #eee; white-space:nowrap; }
  .scroll { overflow-x:auto; }
  .bd .scroll { max-height:230px; overflow:auto; }
  .cod, .bd td { font-family:ui-monospace,Consolas,monospace; font-size:12px; }
  tbody tr.item { cursor:pointer; }
  tbody tr.item:hover { background:#f3f3f0; }
  .hijo td:first-child { padding-left:28px; color:var(--mut); }
  .est { font-size:12px; padding:1px 6px; border-radius:3px; border:1px solid var(--line); }
  .PRODUCIDO { background:#efefec; } .EN_DEPOSITO { background:#e6edf2; } .RESERVADO { background:#f3ecd9; } .DESPACHADO { background:#e4eee6; }
  pre { margin:8px 0 0; padding:8px; background:#f3f3f0; border-left:3px solid var(--line); font:12px/1.4 ui-monospace,Consolas,monospace; white-space:pre-wrap; word-break:break-word; max-height:260px; overflow:auto; }
  pre.ok { border-left-color:#4f7d5c; } pre.err { border-left-color:#a44a3f; }
  @keyframes marca { from { background:#fff3b0; } to { background:transparent; } }
  tr.nuevo td, tr.cambio td { animation:marca 2.5s ease-out; }
  .vacio { color:var(--mut); padding:6px 0; }
</style>
</head>
<body>
<header>
  <h1>SMD Stock</h1>
  <span><small id="salud">…</small><a href="/h2-console" target="_blank">consola H2</a></span>
</header>

<main>
  <div>
    <section>
      <h2>Operar</h2>
      <label for="codigo">Código QR</label>
      <input type="text" id="codigo" placeholder="DEMO-001" autocomplete="off">
      <label for="fecha">Fecha de producción (alta)</label>
      <input type="date" id="fecha">
      <label for="cantidad">Cantidad (alta de lote)</label>
      <input type="number" id="cantidad" min="1" placeholder="5">
      <label for="canal">Canal (reserva)</label>
      <select id="canal">
        <option>DREAMO_LOCAL</option><option>DREAMO_MELI</option><option>DREAMO_FRAVEGA</option><option>RUBIN</option>
      </select>
      <label class="check"><input type="checkbox" id="embalaje" checked> Embalaje OK (ingreso)</label>
      <div class="grupo">
        <button data-a="colchon">Alta colchón</button>
        <button data-a="lote">Alta lote</button>
        <button data-a="ingreso">Ingreso</button>
        <button data-a="reserva">Reserva</button>
        <button data-a="cancelacion">Cancelar reserva</button>
        <button data-a="despacho">Despacho</button>
      </div>
    </section>
    <section>
      <h2>Última respuesta</h2>
      <pre id="resp">Sin llamadas todavía.</pre>
    </section>
  </div>

  <div>
    <section>
      <h2>Inventario</h2>
      <div class="scroll"><table id="inv"></table></div>
    </section>
    <section class="bd">
      <h2>Base de datos (filas reales, las más nuevas primero)</h2>
      <h3>item_inventario</h3>
      <div class="scroll"><table id="bd-item_inventario"></table></div>
      <h3>movimiento (últimas 30)</h3>
      <div class="scroll"><table id="bd-movimiento"></table></div>
    </section>
    <section>
      <h2>Auditoría</h2>
      <div class="scroll"><table id="aud"></table></div>
    </section>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const val = id => $(id).value.trim();

// Llamada de una acción: queda en la pestaña Network y se muestra en "Última respuesta".
async function api(method, url, body) {
  const r = await fetch(url, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : {},
    body: body ? JSON.stringify(body) : undefined
  });
  const data = await r.json().catch(() => null);
  $('resp').textContent = `${method} ${url}  →  ${r.status}\n` + JSON.stringify(data, null, 2);
  $('resp').className = r.ok ? 'ok' : 'err';
}

async function accion(a) {
  const codigo = val('codigo');
  if (a === 'colchon') {
    await api('POST', '/api/inventario/colchones', { codigo, fechaProduccion: val('fecha') || undefined });
  } else if (a === 'lote') {
    await api('POST', '/api/inventario/lotes',
      { codigo, fechaProduccion: val('fecha') || undefined, cantidad: +val('cantidad') || undefined });
  } else {
    const body = { codigo };
    if (a === 'reserva') body.canal = val('canal');
    if (a === 'ingreso') body.embalajeOk = $('embalaje').checked;
    await api('POST', '/api/escaneos/' + a, body);
  }
  await refrescar();
}

const get = url => fetch(url).then(r => r.json());

function tabla(el, cols, filas, fila) {
  $(el).innerHTML = filas.length
    ? '<thead><tr>' + cols.map(c => `<th>${esc(c)}</th>`).join('') + '</tr></thead><tbody>' + filas.map(fila).join('') + '</tbody>'
    : '<tbody><tr><td class="vacio">Sin filas</td></tr></tbody>';
}

function filasInventario(items, nivel = 0) {
  return items.flatMap(i => [
    `<tr class="item ${nivel ? 'hijo' : ''}" data-cod="${esc(i.codigo)}"><td class="cod">${esc(i.codigo)}</td><td>${esc(i.tipo)}</td>`
      + `<td><span class="est ${esc(i.estado)}">${esc(i.estado)}</span></td><td>${esc(i.cantidad)}</td><td>${esc(i.fechaProduccion)}</td></tr>`,
    ...filasInventario(i.hijos || [], nivel + 1)
  ]);
}

// Resalta las filas de la base que son nuevas o cambiaron desde la lectura anterior.
const previo = {};
function tablaBd(nombre, filas) {
  const antes = previo[nombre];
  const ahora = {};
  tabla('bd-' + nombre, filas.length ? Object.keys(filas[0]).map(c => c.toLowerCase()) : [], filas, f => {
    const id = f.ID, texto = JSON.stringify(f);
    ahora[id] = texto;
    const marca = antes ? (!(id in antes) ? 'nuevo' : antes[id] !== texto ? 'cambio' : '') : '';
    return `<tr class="${marca}">` + Object.values(f).map(v => `<td>${esc(v)}</td>`).join('') + '</tr>';
  });
  previo[nombre] = ahora;
}

async function refrescar() {
  const [inv, aud, bd] = await Promise.all([get('/api/inventario'), get('/api/auditoria?limite=10'), get('/api/demo/tablas')]);
  $('inv').innerHTML = inv.length
    ? '<thead><tr><th>código</th><th>tipo</th><th>estado</th><th>cant.</th><th>producción</th></tr></thead><tbody>' + filasInventario(inv).join('') + '</tbody>'
    : '<tbody><tr><td class="vacio">Sin ítems</td></tr></tbody>';
  tabla('aud', ['hora', 'tipo', 'código', 'canal', 'anterior', 'nuevo', 'cant.'], aud, m =>
    `<tr><td>${esc(m.fechaHora.slice(11, 19))}</td><td>${esc(m.tipo)}</td><td class="cod">${esc(m.codigoItem)}</td><td>${esc(m.canal)}</td>`
    + `<td>${esc(m.estadoAnterior)}</td><td>${esc(m.estadoNuevo)}</td><td>${esc(m.cantidad)}</td></tr>`);
  tablaBd('item_inventario', bd.item_inventario);
  tablaBd('movimiento', bd.movimiento);
}

document.querySelectorAll('button[data-a]').forEach(b => b.addEventListener('click', () => accion(b.dataset.a)));
$('inv').addEventListener('click', e => { const tr = e.target.closest('tr[data-cod]'); if (tr) $('codigo').value = tr.dataset.cod; });

get('/api/health').then(h => { $('salud').textContent = `${h.estado} · ${h.perfiles} · ${h.baseDeDatos}`; });
refrescar();
</script>
</body>
</html>
